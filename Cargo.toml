[package]
name = "clinical_trials_lookup"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }
# Pretty printing
colored = "2.0"
# URL encoding
urlencoding = "2.1"
# CSV parsing and writing
csv = "1.3"
# Date/time handling
chrono = "0.4"
# Google Sheets API (optional feature)
google-sheets4 = { version = "5.0", optional = true }
yup-oauth2 = { version = "8.0", optional = true }

[features]
default = []
google-sheets = ["google-sheets4", "yup-oauth2"]
